apply plugin: 'com.android.application'

android {
    namespace = "at.plyrz.app"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "at.plyrz.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        // VersionCode muss bei jedem Upload in Google Play erhöht werden.
        versionCode 3
        versionName "1.0.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        aaptOptions {
            ignoreAssetsPattern =
                '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("CM_KEYSTORE_PATH")
            def keystorePassword = System.getenv("CM_KEYSTORE_PASSWORD")
            def signingKeyAlias = System.getenv("CM_KEY_ALIAS")
            def signingKeyPassword = System.getenv("CM_KEY_PASSWORD")

            if (
                keystorePath &&
                keystorePassword &&
                signingKeyAlias &&
                signingKeyPassword
            ) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword

                logger.lifecycle(
                    "Android release signing configured with Codemagic keystore."
                )
            } else {
                logger.lifecycle(
                    "WARNING: Codemagic signing variables are missing. " +
                    "The release bundle will not be valid for Google Play."
                )
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release

            minifyEnabled false

            proguardFiles(
                getDefaultProguardFile('proguard-android.txt'),
                'proguard-rules.pro'
            )
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(
        include: ['*.jar'],
        dir: 'libs'
    )

    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"

    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')

    if (servicesJSON.exists() && servicesJSON.text?.trim()) {
        apply plugin: 'com.google.gms.google-services'
        logger.lifecycle("Google Services plugin applied.")
    } else {
        logger.lifecycle(
            "google-services.json is missing or empty. " +
            "Android push notifications will not be configured."
        )
    }
} catch (Exception exception) {
    logger.lifecycle(
        "Google Services plugin was not applied: ${exception.message}"
    )
}
