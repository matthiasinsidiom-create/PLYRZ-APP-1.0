apply plugin: 'com.android.application'

android {
    namespace = "at.plyrz.app"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "at.plyrz.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        aaptOptions {
            // Files and folders excluded from the packaged assets.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("CM_KEYSTORE_PATH")
            def keystorePassword = System.getenv("CM_KEYSTORE_PASSWORD")
            def signingKeyAlias = System.getenv("CM_KEY_ALIAS")
            def signingKeyPassword = System.getenv("CM_KEY_PASSWORD")

            if (
                keystorePath != null &&
                keystorePassword != null &&
                signingKeyAlias != null &&
                signingKeyPassword != null
            ) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            } else {
                logger.lifecycle(
                    "Codemagic signing variables are not available. " +
                    "Release signing will only work in the configured Codemagic workflow."
                )
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'),
                'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"

    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')

    if (servicesJSON.exists() && servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    } else {
        logger.lifecycle(
            "google-services.json is missing or empty. " +
            "Google Services and Android push notifications will not be configured."
        )
    }
} catch (Exception exception) {
    logger.lifecycle(
        "Google Services plugin was not applied: ${exception.message}"
    )
}
