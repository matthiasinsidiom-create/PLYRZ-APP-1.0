workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: at.plyrz.app

      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APPLE_TEAM_ID: "Y2Y64P58P7"
        PROVISIONING_PROFILE_NAME: "PLYRZ AppStore Profile Push"

        # Sichtbare App-Version.
        # Bei einem neuen Store-Update manuell erhöhen:
        # 1.0.1 -> 1.0.2 -> 1.1.0 usw.
        APP_VERSION: "1.0.1"

        # Numerische Apple-ID aus App Store Connect.
        # App Store Connect > PLYRZ > App-Informationen > Apple-ID
        APP_APPLE_ID: "6762552423"

      groups:
        - app_store_credentials

    scripts:
      - name: Install dependencies
        script: |
          set -e

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Web App
        script: |
          set -e
          npm run build

      - name: Sync Capacitor iOS
        script: |
          set -e
          npx cap sync ios

      - name: Set iOS version and automatic build number
        script: |
          set -e
          set -o pipefail

          echo "Setting iOS release version to: $APP_VERSION"

          test -n "$APP_APPLE_ID"
          test "$APP_APPLE_ID" != "6762552423"

          # Deine bestehenden Variablennamen auf die von
          # Codemagic CLI erwarteten Namen abbilden.
          export APP_STORE_CONNECT_KEY_IDENTIFIER="$APP_STORE_CONNECT_KEY_ID"
          export APP_STORE_CONNECT_PRIVATE_KEY="$APP_STORE_CONNECT_PUBLISHER_PRIVATE_KEY"

          test -n "$APP_STORE_CONNECT_KEY_IDENTIFIER"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_PRIVATE_KEY"

          echo "Reading latest build number from App Store Connect..."

          LATEST_BUILD_NUMBER=$(
            app-store-connect get-latest-app-store-build-number \
              "$APP_APPLE_ID" \
              --app-store-version="$APP_VERSION" \
              --platform=IOS
          )

          if ! [[ "$LATEST_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "No existing build found for version $APP_VERSION."
            echo "Using Codemagic project build number as fallback."

            IOS_BUILD_NUMBER="${PROJECT_BUILD_NUMBER:-1}"
          else
            IOS_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          fi

          echo "Latest Apple build number: ${LATEST_BUILD_NUMBER:-none}"
          echo "New iOS build number: $IOS_BUILD_NUMBER"

          # Für nachfolgende Skripte verfügbar machen.
          echo "IOS_BUILD_NUMBER=$IOS_BUILD_NUMBER" >> "$CM_ENV"

          cd ios/App

          # Versionsnummer und Buildnummer im Xcode-Projekt setzen.
          xcrun agvtool new-marketing-version "$APP_VERSION"
          xcrun agvtool new-version -all "$IOS_BUILD_NUMBER"

          cd "$CM_BUILD_DIR"

          # Zusätzliche Kontrolle.
          echo "Configured project versions:"
          grep -n "MARKETING_VERSION" ios/App/App.xcodeproj/project.pbxproj \
            | head -n 10 || true

          grep -n "CURRENT_PROJECT_VERSION" ios/App/App.xcodeproj/project.pbxproj \
            | head -n 10 || true

      - name: Apply provisioning profiles
        script: |
          set -e
          xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: Raw Xcode Archive
        script: |
          set -e
          set -o pipefail

          test -n "$APP_VERSION"
          test -n "$IOS_BUILD_NUMBER"

          mkdir -p build/logs
          mkdir -p build/ios/xcarchive

          echo "Archiving PLYRZ version $APP_VERSION ($IOS_BUILD_NUMBER)"

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS" \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive" \
            archive \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGN_STYLE=Manual \
            2>&1 | tee build/logs/xcodebuild-archive.log

      - name: Verify archived version
        script: |
          set -e

          ARCHIVE_INFO_PLIST="$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive/Products/Applications/App.app/Info.plist"

          test -f "$ARCHIVE_INFO_PLIST"

          ARCHIVED_VERSION=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleShortVersionString" \
              "$ARCHIVE_INFO_PLIST"
          )

          ARCHIVED_BUILD=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleVersion" \
              "$ARCHIVE_INFO_PLIST"
          )

          echo "Archived version: $ARCHIVED_VERSION"
          echo "Archived build: $ARCHIVED_BUILD"

          if [ "$ARCHIVED_VERSION" != "$APP_VERSION" ]; then
            echo "ERROR: Expected version $APP_VERSION, got $ARCHIVED_VERSION"
            exit 1
          fi

          if [ "$ARCHIVED_BUILD" != "$IOS_BUILD_NUMBER" ]; then
            echo "ERROR: Expected build $IOS_BUILD_NUMBER, got $ARCHIVED_BUILD"
            exit 1
          fi

          echo "Archive version verification successful."

      - name: Export IPA
        script: |
          set -e
          set -o pipefail

          mkdir -p build/logs
          mkdir -p build/ios/ipa

          cat > build/ios/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>

              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>at.plyrz.app</key>
                  <string>${PROVISIONING_PROFILE_NAME}</string>
              </dict>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>uploadBitcode</key>
              <false/>

              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist "$CM_BUILD_DIR/build/ios/exportOptions.plist" \
            2>&1 | tee build/logs/xcodebuild-export.log

    artifacts:
      - build/ios/ipa/*.ipa
      - build/logs/*.log
      - build/ios/exportOptions.plist

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PUBLISHER_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true


  android-release:
    name: Android Release Build APK + AAB
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 21

      android_signing:
        - plyrz_upload_keystore

    scripts:
      - name: Install dependencies
        script: |
          set -e

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Verify Android signing environment
        script: |
          set -e

          echo "Checking Android signing variables..."

          test -n "$CM_KEYSTORE_PATH"
          test -f "$CM_KEYSTORE_PATH"
          test -n "$CM_KEYSTORE_PASSWORD"
          test -n "$CM_KEY_ALIAS"
          test -n "$CM_KEY_PASSWORD"

          echo "Keystore file found: $CM_KEYSTORE_PATH"
          echo "Key alias: $CM_KEY_ALIAS"
          echo "Android signing environment is ready."

      - name: Build Web App
        script: |
          set -e
          npm run build

      - name: Sync Capacitor Android
        script: |
          set -e
          npx cap sync android

      - name: Set Android SDK location
        script: |
          set -e
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Verify Android configuration
        script: |
          set -e

          test -f android/gradlew
          test -f android/app/build.gradle
          test -f android/app/google-services.json

          echo "Checking version:"
          grep -n "versionCode" android/app/build.gradle
          grep -n "versionName" android/app/build.gradle

          echo "Checking signing configuration:"
          grep -n "CM_KEYSTORE_PATH" android/app/build.gradle
          grep -n "CM_KEYSTORE_PASSWORD" android/app/build.gradle
          grep -n "CM_KEY_ALIAS" android/app/build.gradle
          grep -n "CM_KEY_PASSWORD" android/app/build.gradle
          grep -n "signingConfig signingConfigs.release" android/app/build.gradle

      - name: Build signed Android APK and AAB
        script: |
          set -e
          set -o pipefail

          cd android
          chmod +x gradlew

          ./gradlew \
            clean \
            assembleRelease \
            bundleRelease \
            --stacktrace

      - name: Verify generated artifacts
        script: |
          set -e

          AAB_FILE=$(find android/app/build/outputs/bundle/release \
            -type f \
            -name "*.aab" \
            | head -n 1)

          APK_FILE=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          test -n "$AAB_FILE"
          test -f "$AAB_FILE"

          test -n "$APK_FILE"
          test -f "$APK_FILE"

          echo "AAB created: $AAB_FILE"
          echo "APK created: $APK_FILE"

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB_FILE"

          echo "Android App Bundle signature verified successfully."

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/reports/**/*.html
      - android/app/build/outputs/logs/**/*
