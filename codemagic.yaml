workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: at.plyrz.app

      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APPLE_TEAM_ID: "Y2Y64P58P7"
        PROVISIONING_PROFILE_NAME: "PLYRZ AppStore Profile Push"

      groups:
        - app_store_credentials

    scripts:
      - name: Install dependencies
        script: |
          set -e
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Web App
        script: |
          set -e
          npm run build

      - name: Sync Capacitor iOS
        script: |
          set -e
          npx cap sync ios

      - name: Set iOS build number
        script: |
          set -e

          BUILD_NUMBER=$(date +%s)

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleVersion $BUILD_NUMBER" \
            ios/App/App/Info.plist \
          || /usr/libexec/PlistBuddy \
            -c "Add :CFBundleVersion string $BUILD_NUMBER" \
            ios/App/App/Info.plist

          echo "iOS build number set to $BUILD_NUMBER"

      - name: Apply provisioning profiles
        script: |
          set -e
          xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: Raw Xcode Archive
        script: |
          set -e
          set -o pipefail

          mkdir -p build/logs
          mkdir -p build/ios/xcarchive

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS" \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive" \
            archive \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGN_STYLE=Manual \
            2>&1 | tee build/logs/xcodebuild-archive.log

      - name: Export IPA
        script: |
          set -e
          set -o pipefail

          mkdir -p build/logs
          mkdir -p build/ios/ipa

          cat > build/ios/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>

              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>at.plyrz.app</key>
                  <string>${PROVISIONING_PROFILE_NAME}</string>
              </dict>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>uploadBitcode</key>
              <false/>

              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist "$CM_BUILD_DIR/build/ios/exportOptions.plist" \
            2>&1 | tee build/logs/xcodebuild-export.log

    artifacts:
      - build/ios/ipa/*.ipa
      - build/logs/*.log
      - build/ios/exportOptions.plist

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PUBLISHER_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true


  android-release:
    name: Android Release Build APK + AAB
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 21

      android_signing:
        - plyrz_upload_keystore

    scripts:
      - name: Verify Android signing environment
        script: |
          set -e

          echo "Checking Android signing variables..."

          test -n "$CM_KEYSTORE_PATH"
          test -f "$CM_KEYSTORE_PATH"
          test -n "$CM_KEYSTORE_PASSWORD"
          test -n "$CM_KEY_ALIAS"
          test -n "$CM_KEY_PASSWORD"

          echo "Keystore file found."
          echo "Key alias: $CM_KEY_ALIAS"
          echo "Android signing environment is ready."

      - name: Set Android SDK location
        script: |
          set -e

          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

          echo "Android SDK location configured:"
          cat "$CM_BUILD_DIR/android/local.properties"

      - name: Install dependencies
        script: |
          set -e

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Web App
        script: |
          set -e
          npm run build

      - name: Sync Capacitor Android
        script: |
          set -e
          npx cap sync android

      - name: Verify Android project
        script: |
          set -e

          echo "Checking Android project..."

          test -f android/gradlew
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml

          echo "Checking google-services.json..."
          test -f android/app/google-services.json

          echo "Checking Android package name..."
          grep -n "at.plyrz.app" android/app/build.gradle

          echo "Checking notification permission..."
          grep -n "POST_NOTIFICATIONS" \
            android/app/src/main/AndroidManifest.xml \
            || echo "POST_NOTIFICATIONS permission was not found."

          echo "Checking Capacitor plugins..."
          if [ -f android/app/src/main/assets/capacitor.plugins.json ]; then
            cat android/app/src/main/assets/capacitor.plugins.json
          else
            echo "capacitor.plugins.json was not found."
          fi

      - name: Verify release signing configuration
        script: |
          set -e

          echo "Checking whether build.gradle uses Codemagic signing variables..."

          grep -n "CM_KEYSTORE_PATH" android/app/build.gradle
          grep -n "CM_KEYSTORE_PASSWORD" android/app/build.gradle
          grep -n "CM_KEY_ALIAS" android/app/build.gradle
          grep -n "CM_KEY_PASSWORD" android/app/build.gradle
          grep -n "signingConfig signingConfigs.release" android/app/build.gradle

          echo "Release signing configuration detected."

      - name: Build signed Android APK and AAB
        script: |
          set -e
          set -o pipefail

          cd android

          chmod +x gradlew

          ./gradlew \
            clean \
            assembleRelease \
            bundleRelease \
            --stacktrace

      - name: Verify generated Android artifacts
        script: |
          set -e

          echo "Generated APK files:"
          find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print

          echo "Generated AAB files:"
          find android/app/build/outputs/bundle/release \
            -type f \
            -name "*.aab" \
            -print

          AAB_FILE=$(find android/app/build/outputs/bundle/release \
            -type f \
            -name "*.aab" \
            | head -n 1)

          APK_FILE=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          test -n "$AAB_FILE"
          test -f "$AAB_FILE"

          test -n "$APK_FILE"
          test -f "$APK_FILE"

          echo "Signed AAB created: $AAB_FILE"
          echo "Signed APK created: $APK_FILE"

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/reports/**/*.html
      - android/app/build/outputs/logs/**/*
