workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: at.plyrz.app
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APPLE_TEAM_ID: "Y2Y64P58P7"
        PROVISIONING_PROFILE_NAME: "PLYRZ AppStore Profile Push"
      groups:
        - app_store_credentials

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Build Web App
        script: |
          npm run build

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Set iOS build number
        script: |
          BUILD_NUMBER=$(date +%s)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUMBER" ios/App/App/Info.plist
          echo "Build number set to $BUILD_NUMBER"

      - name: Apply provisioning profiles
        script: |
          xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: Raw Xcode Archive
        script: |
          set -o pipefail
          mkdir -p build/logs
          mkdir -p build/ios/xcarchive

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS" \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive" \
            archive \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGN_STYLE=Manual \
            2>&1 | tee build/logs/xcodebuild-archive.log

      - name: Export IPA
        script: |
          set -o pipefail
          mkdir -p build/logs
          mkdir -p build/ios/ipa

          cat > build/ios/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>at.plyrz.app</key>
                  <string>${PROVISIONING_PROFILE_NAME}</string>
              </dict>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist "$CM_BUILD_DIR/build/ios/exportOptions.plist" \
            2>&1 | tee build/logs/xcodebuild-export.log

    artifacts:
      - build/ios/ipa/*.ipa
      - build/logs/*.log
      - build/ios/exportOptions.plist

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PUBLISHER_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

  android-apk:
    name: Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 21

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Build Web App
        script: |
          npm run build

      - name: Sync Capacitor Android
        script: |
          npx cap sync android

      - name: Verify Android Firebase and permissions
        script: |
          echo "Checking google-services.json..."
          test -f android/app/google-services.json

          echo "Checking Android POST_NOTIFICATIONS permission..."
          grep -n "POST_NOTIFICATIONS" android/app/src/main/AndroidManifest.xml || true

          echo "Checking Capacitor plugins..."
          cat android/app/src/main/assets/capacitor.plugins.json || true

      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
