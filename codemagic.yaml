workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: at.plyrz.app

      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APPLE_TEAM_ID: "Y2Y64P58P7"
        PROVISIONING_PROFILE_NAME: "PLYRZ AppStore Profile Push"

        # Sichtbare Version im App Store.
        # Beim nächsten größeren Update manuell ändern:
        # 1.0.1 -> 1.0.2
        APP_VERSION: "1.0.2"

      groups:
        - app_store_credentials

    scripts:
      - name: Install dependencies
        script: |
          set -e
          set -o pipefail

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Web App
        script: |
          set -e
          set -o pipefail

          npm run build

      - name: Sync Capacitor iOS
        script: |
          set -e
          set -o pipefail

          npx cap sync ios

      - name: Set automatic iOS build number
        script: |
          set -e
          set -o pipefail

          IOS_BUILD_NUMBER="${PROJECT_BUILD_NUMBER}"

          if [ -z "$APP_VERSION" ]; then
            echo "ERROR: APP_VERSION is missing."
            exit 1
          fi

          if [ -z "$IOS_BUILD_NUMBER" ]; then
            echo "ERROR: PROJECT_BUILD_NUMBER is unavailable."
            exit 1
          fi

          if ! [[ "$IOS_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid build number: $IOS_BUILD_NUMBER"
            exit 1
          fi

          echo "Setting iOS version: $APP_VERSION"
          echo "Setting iOS build number: $IOS_BUILD_NUMBER"

          # Für alle nachfolgenden Codemagic-Schritte speichern.
          echo "IOS_BUILD_NUMBER=$IOS_BUILD_NUMBER" >> "$CM_ENV"

          PBXPROJ_PATH="ios/App/App.xcodeproj/project.pbxproj"
          INFO_PLIST_PATH="ios/App/App/Info.plist"

          test -f "$PBXPROJ_PATH"
          test -f "$INFO_PLIST_PATH"

          # Xcode-Marketing-Version setzen.
          sed -i '' \
            "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $APP_VERSION;/g" \
            "$PBXPROJ_PATH"

          # Xcode-Buildnummer setzen.
          sed -i '' \
            "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $IOS_BUILD_NUMBER;/g" \
            "$PBXPROJ_PATH"

          # Info.plist zusätzlich absichern.
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString $APP_VERSION" \
            "$INFO_PLIST_PATH" \
          || /usr/libexec/PlistBuddy \
            -c "Add :CFBundleShortVersionString string $APP_VERSION" \
            "$INFO_PLIST_PATH"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleVersion $IOS_BUILD_NUMBER" \
            "$INFO_PLIST_PATH" \
          || /usr/libexec/PlistBuddy \
            -c "Add :CFBundleVersion string $IOS_BUILD_NUMBER" \
            "$INFO_PLIST_PATH"

          echo ""
          echo "Configured Xcode marketing versions:"
          grep -n "MARKETING_VERSION" "$PBXPROJ_PATH" || true

          echo ""
          echo "Configured Xcode build numbers:"
          grep -n "CURRENT_PROJECT_VERSION" "$PBXPROJ_PATH" || true

          echo ""
          echo "Info.plist version:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$INFO_PLIST_PATH"

          echo "Info.plist build:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            "$INFO_PLIST_PATH"

      - name: Apply provisioning profiles
        script: |
          set -e
          set -o pipefail

          xcode-project use-profiles \
            --project "$XCODE_PROJECT"

      - name: Archive iOS app
        script: |
          set -e
          set -o pipefail

          if [ -z "$IOS_BUILD_NUMBER" ]; then
            echo "ERROR: IOS_BUILD_NUMBER is missing."
            exit 1
          fi

          mkdir -p "$CM_BUILD_DIR/build/logs"
          mkdir -p "$CM_BUILD_DIR/build/ios/xcarchive"

          echo "Archiving PLYRZ"
          echo "Version: $APP_VERSION"
          echo "Build: $IOS_BUILD_NUMBER"

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive" \
            archive \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGN_STYLE=Manual \
            2>&1 | tee "$CM_BUILD_DIR/build/logs/xcodebuild-archive.log"

      - name: Verify archived iOS version
        script: |
          set -e
          set -o pipefail

          ARCHIVE_APP_PATH="$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive/Products/Applications/App.app"
          ARCHIVE_INFO_PLIST="$ARCHIVE_APP_PATH/Info.plist"

          if [ ! -f "$ARCHIVE_INFO_PLIST" ]; then
            echo "ERROR: Archived Info.plist was not found:"
            echo "$ARCHIVE_INFO_PLIST"
            exit 1
          fi

          ARCHIVED_VERSION=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleShortVersionString" \
              "$ARCHIVE_INFO_PLIST"
          )

          ARCHIVED_BUILD=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleVersion" \
              "$ARCHIVE_INFO_PLIST"
          )

          ARCHIVED_BUNDLE_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$ARCHIVE_INFO_PLIST"
          )

          echo "Archived bundle ID: $ARCHIVED_BUNDLE_ID"
          echo "Archived version: $ARCHIVED_VERSION"
          echo "Archived build: $ARCHIVED_BUILD"

          if [ "$ARCHIVED_BUNDLE_ID" != "at.plyrz.app" ]; then
            echo "ERROR: Wrong bundle identifier."
            echo "Expected: at.plyrz.app"
            echo "Found: $ARCHIVED_BUNDLE_ID"
            exit 1
          fi

          if [ "$ARCHIVED_VERSION" != "$APP_VERSION" ]; then
            echo "ERROR: Wrong archived version."
            echo "Expected: $APP_VERSION"
            echo "Found: $ARCHIVED_VERSION"
            exit 1
          fi

          if [ "$ARCHIVED_BUILD" != "$IOS_BUILD_NUMBER" ]; then
            echo "ERROR: Wrong archived build number."
            echo "Expected: $IOS_BUILD_NUMBER"
            echo "Found: $ARCHIVED_BUILD"
            exit 1
          fi

          echo "Archive version verification successful."

      - name: Create export options
        script: |
          set -e
          set -o pipefail

          mkdir -p "$CM_BUILD_DIR/build/ios"
          mkdir -p "$CM_BUILD_DIR/build/ios/ipa"

          cat > "$CM_BUILD_DIR/build/ios/exportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>

              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>at.plyrz.app</key>
                  <string>${PROVISIONING_PROFILE_NAME}</string>
              </dict>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>uploadBitcode</key>
              <false/>

              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          echo "Created exportOptions.plist:"
          cat "$CM_BUILD_DIR/build/ios/exportOptions.plist"

      - name: Export IPA
        script: |
          set -e
          set -o pipefail

          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist "$CM_BUILD_DIR/build/ios/exportOptions.plist" \
            2>&1 | tee "$CM_BUILD_DIR/build/logs/xcodebuild-export.log"

      - name: Verify exported IPA
        script: |
          set -e
          set -o pipefail

          IPA_FILE=$(
            find "$CM_BUILD_DIR/build/ios/ipa" \
              -type f \
              -name "*.ipa" \
              | head -n 1
          )

          if [ -z "$IPA_FILE" ]; then
            echo "ERROR: No IPA file was generated."
            exit 1
          fi

          if [ ! -f "$IPA_FILE" ]; then
            echo "ERROR: IPA file does not exist."
            exit 1
          fi

          echo "IPA successfully generated:"
          echo "$IPA_FILE"

          ls -lh "$IPA_FILE"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/logs/*.log
      - build/ios/exportOptions.plist

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PUBLISHER_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true


  android-release:
    name: Android Release Build APK + AAB
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 21

      android_signing:
        - plyrz_upload_keystore

    scripts:
      - name: Install dependencies
        script: |
          set -e
          set -o pipefail

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Verify Android signing environment
        script: |
          set -e
          set -o pipefail

          echo "Checking Android signing variables..."

          test -n "$CM_KEYSTORE_PATH"
          test -f "$CM_KEYSTORE_PATH"
          test -n "$CM_KEYSTORE_PASSWORD"
          test -n "$CM_KEY_ALIAS"
          test -n "$CM_KEY_PASSWORD"

          echo "Keystore file found: $CM_KEYSTORE_PATH"
          echo "Key alias: $CM_KEY_ALIAS"
          echo "Android signing environment is ready."

      - name: Build Web App
        script: |
          set -e
          set -o pipefail

          npm run build

      - name: Sync Capacitor Android
        script: |
          set -e
          set -o pipefail

          npx cap sync android

      - name: Set Android SDK location
        script: |
          set -e
          set -o pipefail

          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Set automatic Android version code
        script: |
          set -e
          set -o pipefail

          ANDROID_VERSION_CODE="${PROJECT_BUILD_NUMBER}"

          if [ -z "$ANDROID_VERSION_CODE" ]; then
            echo "ERROR: PROJECT_BUILD_NUMBER is unavailable."
            exit 1
          fi

          if ! [[ "$ANDROID_VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid Android version code: $ANDROID_VERSION_CODE"
            exit 1
          fi

          echo "ANDROID_VERSION_CODE=$ANDROID_VERSION_CODE" >> "$CM_ENV"

          echo "Android version code: $ANDROID_VERSION_CODE"

      - name: Verify Android configuration
        script: |
          set -e
          set -o pipefail

          test -f android/gradlew
          test -f android/app/build.gradle
          test -f android/app/google-services.json

          echo "Checking version configuration:"
          grep -n "versionCode" android/app/build.gradle || true
          grep -n "versionName" android/app/build.gradle || true

          echo "Checking signing configuration:"
          grep -n "CM_KEYSTORE_PATH" android/app/build.gradle
          grep -n "CM_KEYSTORE_PASSWORD" android/app/build.gradle
          grep -n "CM_KEY_ALIAS" android/app/build.gradle
          grep -n "CM_KEY_PASSWORD" android/app/build.gradle
          grep -n "signingConfig signingConfigs.release" android/app/build.gradle

      - name: Build signed Android APK and AAB
        script: |
          set -e
          set -o pipefail

          cd android
          chmod +x gradlew

          ./gradlew \
            clean \
            assembleRelease \
            bundleRelease \
            -PversionCode="$ANDROID_VERSION_CODE" \
            --stacktrace

      - name: Verify generated Android artifacts
        script: |
          set -e
          set -o pipefail

          AAB_FILE=$(
            find android/app/build/outputs/bundle/release \
              -type f \
              -name "*.aab" \
              | head -n 1
          )

          APK_FILE=$(
            find android/app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              | head -n 1
          )

          if [ -z "$AAB_FILE" ] || [ ! -f "$AAB_FILE" ]; then
            echo "ERROR: Android App Bundle was not generated."
            exit 1
          fi

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "ERROR: Android APK was not generated."
            exit 1
          fi

          echo "AAB created:"
          echo "$AAB_FILE"
          ls -lh "$AAB_FILE"

          echo "APK created:"
          echo "$APK_FILE"
          ls -lh "$APK_FILE"

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB_FILE"

          echo "Android App Bundle signature verified successfully."

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/reports/**/*.html
      - android/app/build/outputs/logs/**/*
