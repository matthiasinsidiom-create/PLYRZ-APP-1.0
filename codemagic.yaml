workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: at.plyrz.app
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      groups:
        - app_store_credentials

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Build Web App
        script: |
          npm run build

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Ensure iOS push entitlements
        script: |
          echo "Writing App.entitlements..."

          cat > ios/App/App/App.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>aps-environment</key>
              <string>production</string>
          </dict>
          </plist>
          EOF

          echo "Ensuring CODE_SIGN_ENTITLEMENTS in project.pbxproj..."

          python3 - <<'PY'
          from pathlib import Path

          path = Path("ios/App/App.xcodeproj/project.pbxproj")
          text = path.read_text()

          needle = "CODE_SIGN_ENTITLEMENTS = App/App.entitlements;"

          if needle not in text:
              text = text.replace(
                  "ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;\n\t\t\t\tCODE_SIGN_STYLE = Automatic;",
                  "ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;\n\t\t\t\tCODE_SIGN_ENTITLEMENTS = App/App.entitlements;\n\t\t\t\tCODE_SIGN_STYLE = Automatic;"
              )

          path.write_text(text)
          PY

          echo "Final CODE_SIGN_ENTITLEMENTS check:"
          grep -n "CODE_SIGN_ENTITLEMENTS" ios/App/App.xcodeproj/project.pbxproj

          echo "Final App.entitlements:"
          cat ios/App/App/App.entitlements

          echo "Checking aps-environment..."
          grep -n "aps-environment" ios/App/App/App.entitlements

      - name: Set iOS build number
        script: |
          BUILD_NUMBER=$(date +%s)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUMBER" ios/App/App/Info.plist

      - name: Verify Scheme
        script: |
          xcodebuild -list -project "$XCODE_PROJECT"

      - name: Apply provisioning profiles
        script: |
          xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: Build iOS app
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags "-destination 'generic/platform=iOS'"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PUBLISHER_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

  android-apk:
    name: Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 21

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Build Web App
        script: |
          npm run build

      - name: Sync Capacitor Android
        script: |
          npx cap sync android

      - name: Verify Android Firebase and permissions
        script: |
          echo "Checking google-services.json..."
          test -f android/app/google-services.json

          echo "Checking Android POST_NOTIFICATIONS permission..."
          grep -n "POST_NOTIFICATIONS" android/app/src/main/AndroidManifest.xml || true

          echo "Checking Capacitor plugins..."
          cat android/app/src/main/assets/capacitor.plugins.json || true

      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
