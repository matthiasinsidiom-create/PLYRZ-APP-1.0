workflows:
  ios-release:
    name: PLYRZ iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m1

    integrations:
      app_store_connect: plyrz_appstore

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: at.plyrz.app
      groups:
        - apple_credentials
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest

    scripts:
      - name: Install dependencies
        script: |
          npm ci || npm install

      - name: Build Web App
        script: |
          npm run build

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Verify Scheme
        script: |
          xcodebuild -list -project "$XCODE_PROJECT"

      - name: Apply signing
        script: |
          xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: Build iOS app
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
